[project]
name = "motu-client"
version = "0.4.1"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "aiohttp>=3.9.0",
    "aioprometheus[quart]>=23.12.0",
    "hypercorn>=0.18.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.6.0",
    "quart>=0.22.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
